# Include inside the EXISTING server {} that serves the Vite dist directory.
# Its root must point at dist; retain the existing /api/ proxy, TLS and other routes.
# Compress text assets at the actual serving layer (or configure the same at the CDN).
#
# Production currently answers every request without any Cache-Control or ETag, so
# repeat visits re-download the whole bundle. Applying this file fixes that; a CDN in
# front must pass these headers through rather than replace them.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
# nginx labels .js as text/javascript, so both spellings are needed for JS to compress.
gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

# Without an ETag an uncacheable response can only revalidate on Last-Modified.
etag on;

# `always` keeps the header on 304 revalidations and error responses, not just 200s.
location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# HTML must revalidate, so a new deploy can reference the new fingerprinted assets.
# SPA deep links (/models, /docs/...) reach this block through the `try_files $uri
# $uri/ /index.html` fallback: that internal redirect re-runs location matching, so
# they inherit `no-cache` here. Keep the fallback pointing at /index.html.
location = /index.html {
    add_header Cache-Control "no-cache" always;
}

# Vendor marks are pinned to their icon package version, so a new revision arrives
# under a new name and these can be cached hard.
location ^~ /vendors/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000" always;
}

# Crawler files change independently of a release and carry no fingerprint.
location ~* ^/(?:robots\.txt|llms\.txt)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
}

# Legacy public images have stable names; cache briefly instead of indefinitely.
location ~* ^/(?:small-logo|google|github|mail|logo1|tg|Paypal|Tron)\.(?:png|jpg|webp)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
}
